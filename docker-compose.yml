services:
  cassandra1:
    image: cassandra:latest
    container_name: cassandra1
    environment:
      - CASSANDRA_CLUSTER_NAME=studyhub
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
    networks:
      - cassandra-net
    volumes:
      - cassandra1-data-volumen:/var/lib/cassandra
    ports:
      - "9042:9042"    

  cassandra2:
    image: cassandra:latest
    container_name: cassandra2
    environment:
      - CASSANDRA_CLUSTER_NAME=studyhub
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack2
      - CASSANDRA_SEEDS=cassandra1
    networks:
      - cassandra-net
    volumes:
      - cassandra2-data-volumen:/var/lib/cassandra
    ports:
      - "9043:9042"

  cassandra3:
    image: cassandra:latest
    container_name: cassandra3
    environment:
      - CASSANDRA_CLUSTER_NAME=studyhub
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack3
      - CASSANDRA_SEEDS=cassandra1,cassandra2
    networks:
      - cassandra-net
    volumes:
      - cassandra3-data-volumen:/var/lib/cassandra
    ports:
      - "9044:9042"
networks:
  cassandra-net:
    driver: bridge
  
volumes:
  cassandra1-data-volumen:
    driver: local
  cassandra2-data-volumen:
    driver: local
  cassandra3-data-volumen:
    driver: local